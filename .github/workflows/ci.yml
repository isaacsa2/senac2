name: Testes EcoPosto 3D
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes de integridade e regras de operação
        run: node --test tests/smoke.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Chromium de teste
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Testar site real no navegador
        run: |
          python3 -m http.server 8765 --directory public >/tmp/eco-http.log 2>&1 &
          sleep 2
          node tests/browser-smoke.mjs
      - name: Publicar screenshot em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ecoposto-browser-failure
          path: browser-smoke-failed.png
          if-no-files-found: ignore
